[package]
name = "ticros"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["tdogdanov"]
description = "Victoria-like HDD/SSD diagnostic tool in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tdogdanov/ticros"
keywords = ["hdd", "ssd", "smart", "ata", "diagnostic"]
categories = ["command-line-utilities", "hardware-support"]
default-run = "ticros"

[[bin]]
name = "ticros"
path = "src/main.rs"

[dependencies]
# --- CLI ---
clap = { version = "4.5", features = ["derive", "wrap_help"] }

# --- Ошибки ---
anyhow = "1.0"

# --- Сериализация (thresholds, ClassCounts) ---
serde = { version = "1.0", features = ["derive"] }

# --- JSON (парсинг smartctl) ---
serde_json = "1.0"

# --- Прогресс-бар (scan, remap) ---
indicatif = "0.17"

# --- Ctrl+C (scan, remap) ---
ctrlc = "3.4"

# --- Hex-вывод (sense-парсер в ata.rs) ---
hex = "0.4"

# --- Логирование (опционально) ---
env_logger = { version = "0.11", optional = true }
log = { version = "0.4", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["fs", "ioctl"], optional = true }

[features]
default = []

# Логирование через RUST_LOG
logging = ["env_logger", "log"]

# Использовать nix вместо прямых libc-вызовов (экспериментально)
nix-ioctl = ["nix"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1


# Профиль для быстрых сборок в CI
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16